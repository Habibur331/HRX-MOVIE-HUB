
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRX MOVIE HUB - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#fff;font-family:Arial,sans-serif}
header{background:#111c30;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
header h2{color:#38bdf8;margin:0}
button{padding:11px 16px;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
.logout{background:#ef4444;color:white}
.container{max-width:1050px;margin:30px auto;padding:0 18px}
.panel{background:#17243a;padding:22px;border-radius:10px;margin-bottom:22px}
input,textarea,select{width:100%;padding:12px;margin:8px 0 15px;background:#0b1120;color:white;border:1px solid #334155;border-radius:6px}
label{color:#cbd5e1}
.primary{background:#0284c7;color:white}
.secondary{background:#475569;color:white}
.danger{background:#dc2626;color:white}
.movie{display:flex;gap:15px;align-items:center;border-bottom:1px solid #334155;padding:15px 0}
.movie img{width:65px;height:90px;object-fit:cover;border-radius:5px}
.movie-info{flex:1;min-width:0}
.movie-info p{color:#94a3b8;font-size:13px;overflow-wrap:anywhere}
.actions{display:flex;gap:7px;flex-wrap:wrap}
#message{margin:12px 0;color:#38bdf8}
#loading{text-align:center;padding:100px}
.hidden{display:none}
</style>
</head>

<body>

<div id="loading">Checking Admin Login...</div>

<div id="app" class="hidden">

<header>
<h2>HRX MOVIE HUB</h2>
<button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

<div class="panel">
<h2>Admin Dashboard</h2>
<p>Total Movies: <strong id="totalMovies">0</strong></p>
</div>

<div class="panel">
<h2 id="formTitle">Add New Movie</h2>

<form id="movieForm">

<input type="hidden" id="movieId">

<label>Movie Title *</label>
<input id="title" required placeholder="Enter movie title">

<label>Release Year</label>
<input id="year" type="number" placeholder="2026">

<label>Genre</label>
<select id="genre">
<option value="">Select Genre</option>
<option>Action</option>
<option>Adventure</option>
<option>Animation</option>
<option>Comedy</option>
<option>Crime</option>
<option>Drama</option>
<option>Horror</option>
<option>Romance</option>
<option>Science Fiction</option>
<option>Thriller</option>
</select>

<label>Rating</label>
<input id="rating" type="number" min="0" max="10" step="0.1" placeholder="8.5">

<label>Poster Image URL</label>
<input id="poster" type="url" placeholder="https://example.com/poster.jpg">

<label>Legal External Movie Link</label>
<input id="external" type="url" placeholder="Authorized movie link">

<label>Description</label>
<textarea id="description" rows="4" placeholder="Movie description"></textarea>

<button class="primary" type="submit" id="saveBtn">Add Movie</button>
<button class="secondary hidden" type="button" id="cancelBtn">Cancel Edit</button>

<p id="message"></p>
</form>
</div>

<div class="panel">
<h2>Manage Movies</h2>
<div id="movieList">Loading movies...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://sdfrbfyywzlzpkrlpguh.supabase.co";
const SUPABASE_KEY = "sb_publishable_2PkFUoj4M_jAxOpX7AAODw_GW9Jc4G4";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let currentUser = null;

function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[char]);
}

async function startDashboard() {
    const {data, error} = await db.auth.getSession();

    if (error || !data.session) {
        location.replace("admin.html");
        return;
    }

    currentUser = data.session.user;

    const {data: admin, error: adminError} = await db
        .from("admins")
        .select("user_id")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (adminError || !admin) {
        $("loading").textContent = "Access denied. Admin permission not found.";
        await db.auth.signOut();
        return;
    }

    $("loading").classList.add("hidden");
    $("app").classList.remove("hidden");

    await loadMovies();
}

async function loadMovies() {
    $("movieList").textContent = "Loading movies...";

    const {data, error} = await db
        .from("movies")
        .select("*")
        .order("created_at", {ascending:false});

    if (error) {
        $("movieList").textContent = "Error: " + error.message;
        return;
    }

    $("totalMovies").textContent = data.length;

    if (!data.length) {
        $("movieList").textContent = "No movies added yet.";
        return;
    }

    $("movieList").innerHTML = data.map(movie => `
        <div class="movie">
            <img src="${safe(movie.poster_url || "")}"
                 alt="Poster"
                 onerror="this.style.display='none'">
            <div class="movie-info">
                <strong>${safe(movie.title)}</strong>
                <p>${safe(movie.release_year || "")} | ${safe(movie.genre || "")}</p>
            </div>
            <div class="actions">
                <button class="secondary" onclick="editMovie('${safe(movie.id)}')">Edit</button>
                <button class="danger" onclick="deleteMovie('${safe(movie.id)}')">Delete</button>
            </div>
        </div>
    `).join("");
}

$("movieForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = $("movieId").value;

    const movie = {
        title: $("title").value.trim(),
        release_year: $("year").value ? Number($("year").value) : null,
        genre: $("genre").value || null,
        rating: $("rating").value ? Number($("rating").value) : null,
        poster_url: $("poster").value.trim() || null,
        external_url: $("external").value.trim() || null,
        description: $("description").value.trim() || null
    };

    if (!movie.title) {
        $("message").textContent = "Movie title is required.";
        return;
    }

    $("saveBtn").disabled = true;
    $("message").textContent = "Saving...";

    let result;

    if (id) {
        result = await db.from("movies").update(movie).eq("id", id);
    } else {
        result = await db.from("movies").insert(movie);
    }

    $("saveBtn").disabled = false;

    if (result.error) {
        $("message").textContent = "Error: " + result.error.message;
        return;
    }

    $("message").textContent = "Movie saved successfully!";
    resetForm();
    await loadMovies();
});

async function editMovie(id) {
    const {data, error} = await db
        .from("movies")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
        alert(error.message);
        return;
    }

    $("movieId").value = data.id;
    $("title").value = data.title || "";
    $("year").value = data.release_year || "";
    $("genre").value = data.genre || "";
    $("rating").value = data.rating ?? "";
    $("poster").value = data.poster_url || "";
    $("external").value = data.external_url || "";
    $("description").value = data.description || "";

    $("formTitle").textContent = "Edit Movie";
    $("saveBtn").textContent = "Update Movie";
    $("cancelBtn").classList.remove("hidden");

    window.scrollTo({top:0, behavior:"smooth"});
}

async function deleteMovie(id) {
    if (!confirm("Are you sure you want to delete this movie?")) return;

    const {error} = await db.from("movies").delete().eq("id", id);

    if (error) {
        alert("Delete failed: " + error.message);
        return;
    }

    await loadMovies();
}

function resetForm() {
    $("movieForm").reset();
    $("movieId").value = "";
    $("formTitle").textContent = "Add New Movie";
    $("saveBtn").textContent = "Add Movie";
    $("cancelBtn").classList.add("hidden");
}

$("cancelBtn").addEventListener("click", resetForm);

$("logoutBtn").addEventListener("click", async () => {
    const {error} = await db.auth.signOut();

    if (error) {
        alert(error.message);
        return;
    }

    location.replace("admin.html");
});

startDashboard();
</script>

</body>
</html>
